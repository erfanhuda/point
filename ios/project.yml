name: Point
options:
  bundleIdPrefix: com.vesk
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.7"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    SWIFT_ENABLE_TESTABILITY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Point:
    type: application
    platform: iOS
    sources:
      - path: Point
    settings:
      base:
        PRODUCT_NAME: Point
        PRODUCT_BUNDLE_IDENTIFIER: com.vesk.point
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Point
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Point needs access to your photo library to attach item images."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  PointTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PointTests
    settings:
      base:
        PRODUCT_NAME: PointTests
        PRODUCT_BUNDLE_IDENTIFIER: com.vesk.point.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Point.app/Point"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Point

schemes:
  Point:
    build:
      targets:
        Point: all
        PointTests: [test]
    test:
      targets:
        - PointTests
    run:
      config: Debug
